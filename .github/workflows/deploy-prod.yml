name: Deploy production

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  validate:
    uses: ./.github/workflows/validate.yml

  deploy:
    name: deploy
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    permissions:
      contents: read
      id-token: write

    env:
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      GCP_REGION: ${{ vars.GCP_REGION || 'us-west1' }}
      TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
      GCP_RUNTIME_SA: ${{ vars.GCP_RUNTIME_SA }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate configuration
        run: |
          : "${GCP_PROJECT_ID:?Set repository variable GCP_PROJECT_ID.}"
          : "${TF_STATE_BUCKET:?Set repository variable TF_STATE_BUCKET.}"
          : "${GCP_RUNTIME_SA:?Set repository variable GCP_RUNTIME_SA.}"

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Build and push image
        run: |
          IMAGE="${GCP_REGION}-docker.pkg.dev/${GCP_PROJECT_ID}/flipcup/flipcup:${GITHUB_SHA::12}"
          gcloud auth configure-docker "${GCP_REGION}-docker.pkg.dev" --quiet
          docker build -t "${IMAGE}" .
          docker push "${IMAGE}"
          echo "IMAGE=${IMAGE}" >> "$GITHUB_ENV"

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform apply
        working-directory: infra
        run: |
          terraform init -input=false -backend-config="bucket=${TF_STATE_BUCKET}"
          terraform apply -input=false -auto-approve \
            -var "project_id=${GCP_PROJECT_ID}" \
            -var "region=${GCP_REGION}" \
            -var "image=${IMAGE}" \
            -var "runtime_service_account=${GCP_RUNTIME_SA}"
